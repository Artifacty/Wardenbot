name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Python 3.13.3 has setup-python builds for 24.04, not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13.3', '3.13']
    defaults:
      run:
        working-directory: wardenbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
